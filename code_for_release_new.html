<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>씬 사운드트랙 — 장면에 어울리는 곡 찾기</title>
<style>
  :root{
    --paper:#4b93ad;
    --paper-raised:#ffffff;
    --paper-card-bg:#f8fbfa;
    --ink:#ffffff;
    --ink-dark:#22333b;
    --ink-soft:#5c717e;
    --line:#3a7990;
    --card-line:#d8e5e9;
    --accent:#2a6f86;
    --accent-soft:#eaf4f7;
    --accent-deep:#1c4f61;
    --leaf:#4a9e5b;
    --leaf-soft:#e8f7ec;
    --leaf-deep:#1e5e2b;
    --serif:'Iowan Old Style','Palatino Linotype','Noto Serif KR',serif;
    --sans:'Pretendard','Apple SD Gothic Neo',system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.6;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:64px 24px 120px;
  }
  .eyebrow{
    font-size:13px;
    letter-spacing:0.12em;
    color:#d8eff8;
    text-transform:uppercase;
    margin-bottom:14px;
    font-weight:700;
  }
  h1{
    font-family:var(--serif);
    font-weight:400;
    font-size:36px;
    line-height:1.3;
    margin:0 0 16px;
    letter-spacing:-0.01em;
  }
  .lede{
    font-size:15px;
    color:#e5f3f8;
    max-width:54ch;
    margin:0 0 40px;
    line-height:1.7;
  }
  .panel{
    background:#ffffff;
    border:1px solid rgba(0,0,0,0.08);
    border-radius:16px;
    padding:28px;
    margin-bottom:28px;
    box-shadow:0 8px 24px rgba(0,0,0,0.08);
  }
  label{
    display:block;
    font-size:14px;
    font-weight:700;
    color:var(--accent-deep);
    margin-bottom:10px;
  }
  textarea{
    width:100%;
    min-height:140px;
    resize:vertical;
    font-family:var(--sans);
    font-size:15px;
    line-height:1.65;
    color:var(--ink-dark);
    background:#f4f8fa;
    border:1px solid var(--card-line);
    border-radius:10px;
    padding:16px;
    transition:border-color 0.15s ease, box-shadow 0.15s ease;
  }
  textarea::placeholder{
    color:#95a8b1;
  }
  textarea:focus{
    outline:none;
    background:#ffffff;
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(42, 111, 134, 0.15);
  }
  .row-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:16px;
    gap:16px;
  }
  .hint{
    font-size:13px;
    color:var(--ink-soft);
  }
  button.submit{
    appearance:none;
    border:none;
    background:var(--accent);
    color:#fff;
    font-family:var(--sans);
    font-weight:600;
    font-size:14px;
    padding:12px 24px;
    border-radius:9px;
    cursor:pointer;
    white-space:nowrap;
    transition:background 0.15s ease, transform 0.1s ease;
  }
  button.submit:hover{background:var(--accent-deep);}
  button.submit:active{transform:scale(0.98);}
  button.submit:disabled{background:#b2c7ce;cursor:not-allowed;}

  .error-box{
    display:none;
    font-size:13px;
    color:#a12626;
    background:#fdf2f2;
    border:1px solid #f8c9c9;
    padding:12px 16px;
    border-radius:8px;
    margin-top:14px;
  }

  /* 로딩 상태창 */
  .status{
    display:none;
    flex-direction:column;
    gap:12px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:12px;
    padding:18px 20px;
    margin-bottom:28px;
    backdrop-filter:blur(6px);
  }
  .status-top{
    display:flex;
    align-items:center;
    gap:12px;
    font-size:14px;
    font-weight:500;
  }
  .spinner{
    width:18px;
    height:18px;
    border:2.5px solid rgba(255,255,255,0.3);
    border-top-color:#ffffff;
    border-radius:50%;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .progress-pct{
    margin-left:auto;
    font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .progress-track{
    width:100%;
    height:6px;
    border-radius:4px;
    background:rgba(255,255,255,0.2);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    border-radius:4px;
    background:#ffffff;
    transition:width 0.25s ease;
  }

  #results{display:none;}

  .section-label{
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:#d8eff8;
    font-weight:700;
    margin:36px 0 16px;
  }

  /* 추천곡 카드 */
  .track{
    border:1px solid var(--card-line);
    border-radius:14px;
    padding:22px;
    margin-bottom:14px;
    background:#ffffff;
    box-shadow:0 4px 14px rgba(0,0,0,0.06);
    transition:transform 0.15s ease;
  }
  .track.primary{
    border:1.5px solid var(--accent);
    background:var(--accent-soft);
  }
  .track-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
  }
  .track-title{
    font-family:var(--serif);
    font-size:20px;
    font-weight:600;
    color:var(--accent-deep);
    margin-bottom:2px;
  }
  .track-artist{
    color:var(--ink-soft);
    font-size:14px;
    font-weight:500;
  }
  .track-score{
    font-size:12px;
    font-weight:700;
    color:var(--accent);
    background:rgba(42, 111, 134, 0.1);
    padding:4px 10px;
    border-radius:20px;
    white-space:nowrap;
  }
  .track-reason{
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--card-line);
    font-size:14px;
    color:var(--ink-dark);
    line-height:1.65;
  }
  .track-reason::before{
    content:"";
    font-weight:600;
    color:var(--accent);
  }

  .toggle-row{
    margin:32px 0 12px;
  }
  button.toggle{
    appearance:none;
    background:rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.3);
    color:#ffffff;
    font-family:var(--sans);
    font-size:13px;
    font-weight:600;
    padding:10px 18px;
    border-radius:20px;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  button.toggle:hover{background:rgba(255,255,255,0.25);}
  button.toggle .chev{
    display:inline-block;
    margin-left:6px;
    transition:transform 0.2s ease;
  }
  button.toggle[aria-expanded="true"] .chev{transform:rotate(180deg);}

  #nearby{
    display:none;
    margin-top:16px;
    background:#ffffff;
    border-radius:14px;
    padding:16px 22px;
    box-shadow:0 4px 14px rgba(0,0,0,0.06);
  }
  .nearby-track{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    padding:14px 0;
    border-bottom:1px solid #eef3f5;
  }
  .nearby-track:last-child{border-bottom:none;}
  .nearby-title{
    font-size:15px;
    font-weight:600;
    color:var(--ink-dark);
  }
  .nearby-artist{
    color:var(--ink-soft);
    font-size:13px;
  }
  .nearby-topic{
    font-size:12px;
    font-weight:600;
    color:var(--leaf-deep);
    background:var(--leaf-soft);
    padding:5px 12px;
    border-radius:20px;
    white-space:nowrap;
  }

  footer{
    margin-top:56px;
    font-size:12px;
    color:#d8eff8;
    text-align:center;
  }

  @media (max-width:520px){
    .wrap{padding:36px 16px 80px;}
    h1{font-size:26px;}
    .lede{font-size:14px;margin-bottom:28px;}
    .panel{padding:18px;border-radius:12px;}
    textarea{font-size:15px;min-height:120px;padding:12px;}
    .row-bottom{flex-direction:column;align-items:stretch;gap:12px;}
    .hint{text-align:center;}
    button.submit{width:100%;padding:14px 22px;font-size:15px;}
    .track{padding:16px;}
    .track-top{flex-wrap:wrap;gap:6px 12px;}
    .track-title{font-size:18px;}
    button.toggle{width:100%;padding:12px 16px;}
    .nearby-track{flex-direction:column;align-items:flex-start;gap:6px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">Scene → soundtrack</div>
  <h1>어울리는 가사의 노래를 찾아보아요</h1>
  <p class="lede">
    캐릭터의 서사나 특정 장면을 적어주세요. 69만 곡 중에서 입력하신 서사와 가장 깊은 공명을 이루는 곡들을 찾아드립니다.
  </p>

  <div class="panel">
    <label for="scene-input">장면 또는 캐릭터 서사</label>
    <textarea id="scene-input" placeholder="예: 오랜 세월 자신을 억눌러온 곳에서 마침내 벗어났지만, 자유로워진 순간에도 온전히 기뻐하지 못하는 인물의 이야기…"></textarea>
    <div class="row-bottom">
      <span class="hint">한국어로 편하게 적어주세요.</span>
      <button class="submit" id="submit-btn" type="button">곡 찾기</button>
    </div>
    <div class="error-box" id="error-box"></div>
  </div>

  <!-- 진행 상태 표시 -->
  <div class="status" id="status">
    <div class="status-top">
      <div class="spinner"></div>
      <span>서사를 분석하고 어울리는 곡을 선별하는 중…</span>
      <span class="progress-pct" id="progress-pct">0%</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <!-- 결과 영역 -->
  <div id="results">
    <div class="section-label">가장 어울리는 세 곡</div>
    <div id="top3"></div>

    <div class="toggle-row">
      <button class="toggle" id="toggle-nearby" type="button" aria-expanded="false">
        다른 결의 곡도 보기<span class="chev">⌄</span>
      </button>
    </div>
    <div id="nearby"></div>
  </div>

  <footer>같은 장면도 매번 조금씩 다르게 읽힐 수 있어요. 문장을 바꿔 다시 시도해보세요.</footer>

</div>

<script>
  // API 주소 (필요 시 로컬 http://localhost:8000/recommend 또는 배포 주소로 수정)
  const API_URL = "https://etyagr7j2ymp3i-8002.proxy.runpod.net/recommend";

  const input = document.getElementById('scene-input');
  const submitBtn = document.getElementById('submit-btn');
  const errorBox = document.getElementById('error-box');
  const status = document.getElementById('status');
  const results = document.getElementById('results');
  const top3El = document.getElementById('top3');
  const nearbyEl = document.getElementById('nearby');
  const toggleBtn = document.getElementById('toggle-nearby');
  const progressFill = document.getElementById('progress-fill');
  const progressPct = document.getElementById('progress-pct');
  let progressTimer = null;

  function startProgress(){
    let pct = 0;
    progressFill.style.width = '0%';
    progressPct.textContent = '0%';
    if (progressTimer) clearInterval(progressTimer);
    progressTimer = setInterval(() => {
      const step = pct < 60 ? 3.5 : pct < 85 ? 1.2 : 0.3;
      pct = Math.min(pct + step, 92);
      progressFill.style.width = pct + '%';
      progressPct.textContent = Math.round(pct) + '%';
    }, 200);
  }

  function finishProgress(){
    if (progressTimer) clearInterval(progressTimer);
    progressFill.style.width = '100%';
    progressPct.textContent = '100%';
  }

  toggleBtn.addEventListener('click', () => {
    const expanded = toggleBtn.getAttribute('aria-expanded') === 'true';
    toggleBtn.setAttribute('aria-expanded', String(!expanded));
    nearbyEl.style.display = expanded ? 'none' : 'block';
    toggleBtn.childNodes[0].textContent = expanded ? '다른 결의 곡도 보기' : '다른 결의 곡 숨기기';
  });

  submitBtn.addEventListener('click', handleSubmit);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) handleSubmit();
  });

  async function handleSubmit(){
    const text = input.value.trim();
    errorBox.style.display = 'none';

    if (!text){
      errorBox.textContent = '장면 또는 캐릭터 서사를 먼저 적어주세요.';
      errorBox.style.display = 'block';
      return;
    }

    submitBtn.disabled = true;
    status.style.display = 'flex';
    results.style.display = 'none';
    nearbyEl.style.display = 'none';
    toggleBtn.setAttribute('aria-expanded', 'false');
    toggleBtn.childNodes[0].textContent = '다른 결의 곡도 보기';
    startProgress();

    try{
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({scene_description: text})
      });

      if (!res.ok) throw new Error('서버 응답 오류 (' + res.status + ')');

      const data = await res.json();
      finishProgress();

      // 프로그레스 바 100% 완료를 잠시 보여준 후 결과 렌더링
      setTimeout(() => {
        status.style.display = 'none';
        renderResults(data);
      }, 250);

    }catch(err){
      if (progressTimer) clearInterval(progressTimer);
      status.style.display = 'none';
      errorBox.textContent = '곡을 찾지 못했어요. 서버 연결 및 프록시 상태를 확인하고 다시 시도해주세요.';
      errorBox.style.display = 'block';
    }finally{
      submitBtn.disabled = false;
    }
  }

  function renderResults(data){
    top3El.innerHTML = '';
    (data.top3 || []).forEach((track, i) => {
      const div = document.createElement('div');
      div.className = 'track' + (i === 0 ? ' primary' : '');
      const pct = Math.round((track.similarity || 0) * 100);

      let html = 
        '<div class="track-top">' +
          '<div>' +
            '<div class="track-title">' + escapeHtml(track.title || '제목 미상') + '</div>' +
            '<div class="track-artist">' + escapeHtml(track.artist || '아티스트 미상') + '</div>' +
          '</div>' +
          '<div class="track-score">' + pct + '% 일치</div>' +
        '</div>';

      // 추천 이유가 있을 경우 표시
      if (track.reason){
        html += '<div class="track-reason">' + escapeHtml(track.reason) + '</div>';
      }

      div.innerHTML = html;
      top3El.appendChild(div);
    });

    nearbyEl.innerHTML = '';
    (data.nearby_cluster_reps || []).forEach(track => {
      const div = document.createElement('div');
      div.className = 'nearby-track';
      div.innerHTML =
        '<div>' +
          '<div class="nearby-title">' + escapeHtml(track.title || '제목 미상') + '</div>' +
          '<div class="nearby-artist">' + escapeHtml(track.artist || '아티스트 미상') + '</div>' +
        '</div>' +
        '<div class="nearby-topic">' + escapeHtml(track.cluster_topic_name || '기타 테마') + '</div>';
      nearbyEl.appendChild(div);
    });

    results.style.display = 'block';
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
